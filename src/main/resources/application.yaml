debug: false
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: notification-service
  config:
    import: optional:file:../infra/env/.env[.properties]
  jackson:
    property-naming-strategy: SNAKE_CASE
  #  # ===================================================
  #  # データソース & HikariCP設定
  #  # ===================================================
  #  datasource:
  #    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  #    username: ${DB_USERNAME}
  #    password: ${DB_PASSWORD}
  #    driver-class-name: org.postgresql.Driver
  #    hikari:
  #      # プール内の最大コネクション数
  #      maximum-pool-size: 10
  #      # 常に保持しておく最低限の待機コネクション数
  #      minimum-idle: 2
  #      # コネクション取得のタイムアウト時間（ミリ秒：デフォルト30秒）
  #      connection-timeout: 30000
  #      # コネクションの最大生存時間（ミリ秒：デフォルト30分）※DB側の切断設定より短くするのが鉄則！
  #      max-lifetime: 1800000
  #  # ===================================================
  #  # インフラツール設定 (Flyway / jOOQ)
  #  # ===================================================
  #  flyway:
  #    enabled: ${SPRING_FLYWAY_ENABLED:true}
  #    baseline-on-migrate: true
  #  jooq:
  #    sql-dialect: postgres
  # ===================================================
  # Kafka メッセージング設定
  # ===================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:shared-kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.computer_rescuer.*"
    producer:
      # @RetryableTopic がリトライやDLTへメッセージを再転送する際に使用
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
# ===================================================
# アプリケーション独自設定
# ===================================================
app:
  # ===================================================
  # 外部API連携設定 (LINE WORKS)
  # ===================================================
  line-works:
    base-url: ${LW_BASE_URL:}
    client-id: ${LW_CLIENT_ID:}
    client-secret: ${LW_CLIENT_SECRET:}
    service-account: ${LW_SERVICE_ACCOUNT:}
    private-key: ${LW_PRIVATE_KEY_PATH:}
    bot-id: ${LW_BOT_ID:}
    alert-channel-id: ${LW_ALERT_CHANNEL_ID:}
    system-manager-id: ${LW_APP_SYSTEM_MANAGER:}
  # ===================================================
  # Kafka設定
  # ===================================================
  kafka:
    topics:
      notification: ${APP_KAFKA_TOPIC_NOTIFICATION:notification-topic}
      unstamped-alert: ${APP_KAFKA_TOPIC_UNSTAMPED_ALERT:unstamped-alert-topic}
      unstamped-direct: ${APP_KAFKA_TOPIC_UNSTAMPED_DIRECT:unstamped-direct-topic}
    retry:
      max-attempts: ${APP_KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${APP_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
      multiplier: ${APP_KAFKA_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${APP_KAFKA_RETRY_MAX_DELAY_MS:10000}
# ===================================================
# API仕様書
# ===================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.computer_rescuer.notification: ${LOG_LEVEL_APP_ROOT:INFO}
    
debug: false
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: notification-service
  config:
    import: optional:file:../infra/env/.env[.properties]
  jackson:
    property-naming-strategy: SNAKE_CASE
  #  # ===================================================
  #  # データソース & HikariCP設定
  #  # ===================================================
  #  datasource:
  #    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  #    username: ${DB_USERNAME}
  #    password: ${DB_PASSWORD}
  #    driver-class-name: org.postgresql.Driver
  #    hikari:
  #      # プール内の最大コネクション数
  #      maximum-pool-size: 10
  #      # 常に保持しておく最低限の待機コネクション数
  #      minimum-idle: 2
  #      # コネクション取得のタイムアウト時間（ミリ秒：デフォルト30秒）
  #      connection-timeout: 30000
  #      # コネクションの最大生存時間（ミリ秒：デフォルト30分）※DB側の切断設定より短くするのが鉄則！
  #      max-lifetime: 1800000
  #  # ===================================================
  #  # インフラツール設定 (Flyway / jOOQ)
  #  # ===================================================
  #  flyway:
  #    enabled: ${SPRING_FLYWAY_ENABLED:true}
  #    baseline-on-migrate: true
  #  jooq:
  #    sql-dialect: postgres
  # ===================================================
  # Kafka メッセージング設定
  # ===================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:shared-kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer # これがないと不正データで無限ループ
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer # これがないと不正データで無限ループ
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer # エラーハンドリングされている実際に動くデシリアライザー
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.ByteArrayDeserializer # エラーハンドリングされている実際に動くデシリアライザー
        #        spring.json.trusted.packages: "com.computer_rescuer.*"
        # FIXME: 全許容では意味がないので是非は必ず確認する
        spring.json.trusted.packages: "*"
        # FIXME: 「spring.json.use.type.headers: false」との矛盾は後で必ず確認する
        spring.json.value.default.type: "java.lang.Object"
    #        # マイクロサービス間での連携や外部システムとの通信において、Java固有の型ヘッダーに依存したくない場合、またはデシリアライズエラーを安全に扱う場合はfalseとする
    #        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 💡 Spring Kafka 4.0 正式推奨の Jackson シリアライザ！
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
# ===================================================
# アプリケーション独自設定
# ===================================================
app:
  # ===================================================
  # 外部API連携設定 (LINE WORKS)
  # ===================================================
  line-works:
    base-url: ${LW_BASE_URL:}
    client-id: ${LW_CLIENT_ID:}
    client-secret: ${LW_CLIENT_SECRET:}
    service-account: ${LW_SERVICE_ACCOUNT:}
    private-key: ${LW_PRIVATE_KEY_PATH:}
    bot-id: ${LW_BOT_ID:}
    alert-channel-id: ${LW_ALERT_CHANNEL_ID:}
    system-manager-id: ${LW_APP_SYSTEM_MANAGER:}
  # ===================================================
  # Kafka設定
  # ===================================================
  kafka:
    topics:
      notification: ${APP_KAFKA_TOPIC_NOTIFICATION:notification-topic}
      unstamped-alert: ${APP_KAFKA_TOPIC_UNSTAMPED_ALERT:unstamped-alert-topic}
      unstamped-direct: ${APP_KAFKA_TOPIC_UNSTAMPED_DIRECT:unstamped-direct-topic}
      attendance-irregularity: ${APP_KAFKA_TOPIC_ATTENDANCE_IRREGULARITY:attendance-irregularity-topic}
    retry:
      max-attempts: ${APP_KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${APP_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
      multiplier: ${APP_KAFKA_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${APP_KAFKA_RETRY_MAX_DELAY_MS:10000}
# ===================================================
# API仕様書
# ===================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
